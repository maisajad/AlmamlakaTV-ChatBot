<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Almamlaka TV Assistant</title>
  <meta name="description" content="Ask questions about Almamlaka TV's Digital Expansion Initiative. Answers come only from the project documents, with sources.">
  <meta name="theme-color" content="#9e0b0f">
  <link rel="icon" type="image/png" href="/static/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/" aria-label="Almamlaka TV">
        <img class="brand-logo" src="/static/logo.png" alt="قناة المملكة" width="119" height="35">
        <span class="brand-divider" aria-hidden="true"></span>
        <span class="brand-title" data-i18n="title"></span>
      </a>
      <div class="topbar-actions">
        <button class="btn-ghost" id="lang-toggle" type="button" data-i18n-aria="switchLanguage"></button>
        <button class="btn-ghost" id="new-chat" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
          <span data-i18n="newChat"></span>
        </button>
      </div>
    </div>
  </header>

  <div class="modebar">
    <div class="modebar-inner">
      <div class="mode-switch" role="group" data-i18n-aria="modeLabel">
        <button type="button" data-mode="standard" aria-pressed="true" data-i18n="modeStandard"></button>
        <button type="button" data-mode="pro" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M12 2l2.4 7.2H22l-6.2 4.5 2.4 7.3-6.2-4.5-6.2 4.5 2.4-7.3L2 9.2h7.6z" fill="currentColor"/></svg>
          <span data-i18n="modePro"></span>
        </button>
      </div>
    </div>
  </div>

  <main class="chat" id="chat">
    <section class="welcome" id="welcome">
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="welcomeTitle"></h1>
      <p class="welcome-text" data-i18n="welcomeText"></p>
      <div class="suggestions" id="suggestions"></div>
    </section>
    <ol class="messages" id="messages" aria-live="polite"></ol>
  </main>

  <footer class="composer-wrap">
    <form class="composer" id="composer">
      <label class="visually-hidden" for="input" data-i18n="inputLabel"></label>
      <textarea id="input" rows="1" dir="auto" maxlength="1000" autocomplete="off" data-i18n-placeholder="placeholder"></textarea>
      <button class="send" id="send" type="submit" data-i18n-aria="send">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
    </form>
    <p class="disclaimer"><span data-i18n="disclaimer"></span> <a href="/quality" data-i18n="qualityLink"></a></p>
  </footer>

  <aside class="viewer" id="viewer" hidden aria-labelledby="viewer-title">
    <div class="viewer-head">
      <div class="viewer-heading">
        <h2 id="viewer-title"></h2>
        <p id="viewer-meta"></p>
      </div>
      <a class="btn-ghost" id="viewer-open" target="_blank" rel="noopener"></a>
      <button class="btn-ghost viewer-close" id="viewer-close" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
    </div>
    <p class="viewer-note" id="viewer-note" hidden></p>
    <div class="viewer-body" id="viewer-body"></div>
  </aside>

  <script src="/static/auth.js"></script>
  <script src="/static/app.js"></script>
  <script src="/static/viewer.js"></script>
  <script src="/static/pro.js"></script>
  <script src="/static/voice.js"></script>
</body>
</html>
